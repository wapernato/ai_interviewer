spring.application.name=ai-tutor

spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/ai_interviewer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

app.backend-url=${APP_BACKEND_URL:http://localhost:8080}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:2525   }
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
internal.api-key=${JAVA_INTERNAL_API_KEY:dev-internal-key}

server.port=${SERVER_PORT:8081}
