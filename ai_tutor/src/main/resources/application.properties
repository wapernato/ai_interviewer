spring.application.name=ai-tutor

spring.datasource.url= ${DB_URL:jdbc:postgresql://localhost:5432/ai_interviewer}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

app.jwt.secret=${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
internal.api-key=${JAVA_INTERNAL_API_KEY:dev-internal-key}

server.port=${SERVER_PORT:8080}